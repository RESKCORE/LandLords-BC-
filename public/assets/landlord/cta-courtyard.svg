<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="ctaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f0e7"/>
      <stop offset="45%" stop-color="#ebd9c3"/>
      <stop offset="100%" stop-color="#c89e74"/>
    </linearGradient>
    <radialGradient id="ctaSun" cx="78%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff4da" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f2c687" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d49b6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ead7c0"/>
      <stop offset="100%" stop-color="#b99470"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ctaSky)"/>
  <rect width="1600" height="900" fill="url(#ctaSun)"/>

  <!-- Golden Hour Courtyard Colonnade on Right -->
  <g transform="translate(560, 80)">
    <path d="M0 0 L1040 0 L1040 820 L0 820 Z" fill="url(#archStone)"/>
    <!-- Three Sunlit Courtyard Arches -->
    <path d="M70 820 L70 310 A125 125 0 0 1 320 310 L320 820 Z" fill="#f9efe0"/>
    <path d="M395 820 L395 310 A125 125 0 0 1 645 310 L645 820 Z" fill="#f9efe0"/>
    <path d="M720 820 L720 310 A125 125 0 0 1 970 310 L970 820 Z" fill="#f9efe0"/>
    <!-- Inner Arch Depth -->
    <path d="M98 820 L98 320 A110 110 0 0 1 320 320 L320 820 Z" fill="#d9b489"/>
    <path d="M423 820 L423 320 A110 110 0 0 1 645 320 L645 820 Z" fill="#d9b489"/>
    <path d="M748 820 L748 320 A110 110 0 0 1 970 320 L970 820 Z" fill="#d9b489"/>
  </g>

  <!-- Warm Travertine Terrace Floor & Long Golden Shadows -->
  <polygon points="0,720 1600,720 1600,900 0,900" fill="#e2cdb3"/>
  <polygon points="630,720 880,720 420,900 120,900" fill="#fff6e6" opacity="0.65"/>
  <polygon points="955,720 1205,720 790,900 490,900" fill="#fff6e6" opacity="0.65"/>
  <polygon points="1280,720 1530,720 1160,900 860,900" fill="#fff6e6" opacity="0.65"/>
</svg>
