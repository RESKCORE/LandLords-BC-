<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="skyHand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9dcef"/>
      <stop offset="45%" stop-color="#dfe8f1"/>
      <stop offset="80%" stop-color="#efe7da"/>
      <stop offset="100%" stop-color="#e5d6c3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#fff6df" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f7e2be" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#efe7da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2116"/>
      <stop offset="55%" stop-color="#2a1a12"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="brassKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df9c"/>
      <stop offset="50%" stop-color="#d8ab4e"/>
      <stop offset="100%" stop-color="#9c6f21"/>
    </linearGradient>
    <linearGradient id="handSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb08b"/>
      <stop offset="55%" stop-color="#c58f69"/>
      <stop offset="100%" stop-color="#966341"/>
    </linearGradient>
  </defs>

  <!-- Pale Sky & Warm Horizon -->
  <rect width="900" height="1200" fill="url(#skyHand)"/>
  <rect width="900" height="1200" fill="url(#sunGlow)"/>

  <!-- Raised Confidential Member Charter Card & Brass Privacy Shield -->
  <g transform="translate(315, 175) rotate(-7)">
    <!-- Top Brass Privacy Crest Tab -->
    <rect x="85" y="-58" width="60" height="72" rx="12" fill="url(#brassKey)"/>
    <circle cx="115" cy="-32" r="14" fill="#2a1a12"/>

    <!-- Espresso & Gold Encrypted Member Card -->
    <rect x="0" y="0" width="230" height="360" rx="28" fill="url(#cardBody)" stroke="url(#brassKey)" stroke-width="3"/>
    <rect x="18" y="18" width="194" height="324" rx="18" fill="none" stroke="#f7df9c" stroke-width="1" opacity="0.35"/>

    <!-- Privacy Shield Medallion -->
    <path d="M115 62 L155 78 L155 118 C155 148 115 168 115 168 C115 168 75 148 75 118 L75 78 Z" fill="url(#brassKey)"/>
    <path d="M103 115 L112 124 L129 104" fill="none" stroke="#2a1a12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Encrypted Member Credential Text -->
    <text x="115" y="210" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="13" letter-spacing="3.5" fill="#f7df9c">LANDLORDS ASSOC.</text>
    <text x="115" y="242" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="22" font-weight="500" fill="#f6f0e7">PRIVATE MEMBER</text>
    <rect x="48" y="265" width="134" height="26" rx="13" fill="rgba(247,223,156,0.14)"/>
    <text x="115" y="283" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11.5" letter-spacing="2" fill="#f7df9c">ID • ANON-8842</text>
  </g>

  <!-- Sculptural Hand Holding the Member Card -->
  <g transform="translate(245, 420)">
    <rect x="48" y="45" width="95" height="44" rx="22" transform="rotate(-12 48 45)" fill="url(#handSkin)"/>
    <rect x="40" y="96" width="102" height="44" rx="22" transform="rotate(-10 40 96)" fill="url(#handSkin)"/>
    <rect x="44" y="148" width="96" height="42" rx="21" transform="rotate(-8 44 148)" fill="url(#handSkin)"/>

    <path d="M185 35 C235 35 270 85 265 155 C260 225 235 310 215 390 L75 390 C65 305 68 220 95 165 C120 115 150 35 185 35 Z" fill="url(#handSkin)"/>
    <rect x="145" y="10" width="62" height="125" rx="30" transform="rotate(18 145 10)" fill="url(#handSkin)"/>

    <path d="M82 370 L215 370 L235 800 L55 800 Z" fill="url(#handSkin)"/>
    <path d="M42 520 L248 505 L275 820 L20 820 Z" fill="#f5ede0"/>
    <path d="M42 520 L248 505 L252 555 L38 570 Z" fill="#e6d8c4"/>
    <circle cx="95" cy="615" r="12" fill="#b68834"/>
  </g>
</svg>
